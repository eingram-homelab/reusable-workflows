---
name: Init, Plan, and Apply Terraform
on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository containing Terraform code to lint'
        type: string
        default: ''
      ref:
        description: 'Branch or ref to check out. Defaults to the PR head branch.'
        type: string
        default: ''
      all_changed_dirs:
        description: 'List of all changed terraform dirs'
        type: string
        default: ''
      auth_token:
        description: 'Google Cloud auth token'
        type: string
        default: ''
      project_id:
        description: 'Google Cloud project ID'
        type: string
        default: ''
      environment:
        description: 'Environment to apply Terraform changes to'
        type: string
        required: true
      run-id:
        description: 'Run ID'
        type: string
        required: false
    secrets:
      VAULT_TOKEN:
        description: 'Vault token for accessing secrets'
        required: true
      GH_TF_TOKEN:
        description: 'GitHub token for accessing Terraform plan artifacts'
        required: true

defaults:
  run:
    shell: bash

jobs:
  get_run_id:
    if: ${{ github.event_name == 'push' }}
    name: Get Run ID
    runs-on: arc-runners
    permissions:
      actions: read
      contents: read
    outputs:
      run-id: ${{ steps.find.outputs.run-id }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.head_ref }}

      - name: Get run ID for merge commit
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_head_sha=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[] | select(.merged_at != null)][0].head.sha')
          if [ -z "$pr_head_sha" ]; then
            echo "No merged PR found for merge commit ${{ github.sha }}" >&2
            exit 1
          fi

          run_id=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "PR Workflow / Terraform" \
            --commit "$pr_head_sha" \
            --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion == "success")][0].databaseId')
          if [ -z "$run_id" ]; then
            echo "No successful PR Workflow run found for PR head $pr_head_sha" >&2
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

  set_files_dirs:
    name: Set Changed Files and Directories
    needs: get_run_id
    if: ${{ (always() && needs.get_run_id.outputs.run-id != '') || inputs.run-id != '' }}
    permissions:
      contents: 'read'
    runs-on: arc-runners
    outputs:
      tf_dirs: ${{ steps.get-changed-dirs.outputs.tf_dirs }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.head_ref }}

      - name: Get dirs of changed Terraform files
        id: get-changed-dirs
        env:
          ALL_CHANGED_DIRS: ${{ inputs.all_changed_dirs }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          echo "Setting environment variable for ${ENVIRONMENT}"
          if [[ $ENVIRONMENT == "staging" ]]; then
            echo "Setting environment var to stg"
            export ENVIRONMENT="stg"
          elif [[ $ENVIRONMENT == "production" ]]; then
            echo "Setting environment var to prod"
            export ENVIRONMENT="prod"
          fi
          tf_dirs=()
          for dir in $ALL_CHANGED_DIRS; do
            if [[ "${dir}" == */environments/"${ENVIRONMENT}" ]]; then
              if find "$dir" -maxdepth 1 -type f -name "*.tfvars" | grep -q tfvars; then
                tf_dirs+=("${dir}")
              fi
            fi
          done
          echo "Terraform Dirs - ${tf_dirs[*]}"
          json_array=$(jq --compact-output --null-input '$ARGS.positional' --args "${tf_dirs[@]}")
          echo "tf_dirs=${json_array}" >> "$GITHUB_OUTPUT"

  init_apply:
    name: Init and Apply Terraform Project
    needs:
      - set_files_dirs
      - get_run_id
    if: ${{ (always() && needs.get_run_id.outputs.run-id != '') || inputs.run-id != '' }}
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: arc-runners
    environment: ${{ inputs.environment }}
    strategy:
      matrix:
        tf_dir: ${{ fromJSON(needs.set_files_dirs.outputs.tf_dirs) }}
      fail-fast: true
      max-parallel: 2
    concurrency:
      group: "apply-${{ matrix.tf_dir }}"
      cancel-in-progress: false
    env:
      VAULT_ADDR: ${{ vars.VAULT_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.head_ref }}

      - name: Get Google Cloud auth_token
        id: get-auth-token
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_WORKLOAD_SERVICE_ACCOUNT }}
          # project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Login to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ">= 1.15.0"

      - name: Setup nodejs
        uses: actions/setup-node@v3.7.0
        with:
          node-version: 20

      - name: Run terraform init
        id: init
        working-directory: ${{ matrix.tf_dir }}
        run: |
          echo "Running terraform init for ${{ matrix.tf_dir }}"
          terraform init -backend-config="prefix=${{ matrix.tf_dir }}" -input=false

      # - name: Checkov
      #   id: checkov
      #   uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf
      #   with:
      #     directory: ${{ matrix.tf_dir }}
      #     framework: terraform
      #     quiet: true
      #     skip_check: CKV_TF_1,CKV2_GCP_5,CKV_GCP_62,CKV_GCP_76,CKV2_GCP_18,CKV_GCP_113
      #     output_format: github_failed_only
      #     soft_fail: false
      #     download_external_modules: false

      - name: Generate safe name for artifact download
        id: generate-safe-name
        env:
          DIR: ${{ matrix.tf_dir }}
        run: |
          echo "Creating file name from matrix tf_dir: ${{ matrix.tf_dir }}"
          safe_name="${DIR//\//_}"
          echo "File name: $safe_name"
          echo "safe_name=$safe_name" >> "$GITHUB_OUTPUT"

      - name: Download Terraform Plan Artifact
        id: download-plan-artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: tfplan-${{ steps.generate-safe-name.outputs.safe_name }}
          run-id: ${{ inputs.run-id || needs.get_run_id.outputs.run-id }}
          path: ${{ matrix.tf_dir }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run terraform apply using downloaded plan
        id: apply
        working-directory: ${{ matrix.tf_dir }}
        env:
          GH_TOKEN: ${{ secrets.GH_TF_TOKEN }} # Needed for creating GitHub repos
        run: |
          echo "Running terraform apply for ${{ steps.generate-safe-name.outputs.safe_name }}"
          terraform apply -input=false -auto-approve "tfplan-${{ steps.generate-safe-name.outputs.safe_name }}"
