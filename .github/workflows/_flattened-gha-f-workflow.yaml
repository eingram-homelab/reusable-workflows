---
name: Flattened GitHub Actions Workflow - Feature Branch

on:
  workflow_call:
    inputs:
      yamllint_config:
        description: 'Path to yamllint config file relative to the repository root'
        type: string
        default: ''
      repository:
        description: 'Repository containing workflow files to validate'
        type: string
        default: ''
      ref:
        description: 'Branch or ref to check out. Defaults to the current ref.'
        type: string
        default: ''
      fetch_depth:
        description: 'Git fetch depth to use during checkout. Use 0 for full history.'
        type: number
        default: 0

jobs:
  check_for_changes:
    name: Check for changed files
    uses: ./.github/workflows/_check_for_changes.yaml
    with:
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}

  validate:
    name: Run Validation Checks
    needs: check_for_changes
    if: |
      needs.check_for_changes.outputs.any_changed == 'true' &&
      (contains(needs.check_for_changes.outputs.all_changed_files, '.github/workflows/') ||
      contains(needs.check_for_changes.outputs.all_changed_files, '.github/actions/'))
    uses: ./.github/workflows/_gha-validate-workflow.yaml
    with:
      all_changed_files: ${{ needs.check_for_changes.outputs.all_changed_files }}
      yamllint_config: ${{ inputs.yamllint_config }}

  ci-gate:
    if: always()
    needs: validate
    runs-on: arc-runners
    steps:
      - name: CI Gate Check
        env:
          FAILURE_CHECK: ${{ contains(needs.*.result, 'failure') }}
          CANCELLED_CHECK: ${{ contains(needs.*.result, 'cancelled') }}
        run: |
          if [[ "$FAILURE_CHECK" == "true" || \
                "$CANCELLED_CHECK" == "true" ]]; then
            exit 1
          fi
