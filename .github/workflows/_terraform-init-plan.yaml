---
name: Init and Plan Terraform
on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository containing Terraform code to lint'
        type: string
        default: ''
      ref:
        description: 'Branch or ref to check out. Defaults to the PR head branch.'
        type: string
        default: ''
      all_changed_dirs:
        description: 'List of all changed directories'
        type: string
        default: ''
      auth_token:
        description: 'Google Cloud auth token'
        type: string
        default: ''
      project_id:
        description: 'Google Cloud project ID'
        type: string
        default: ''
    secrets:
      VAULT_TOKEN:
        description: 'Vault token for accessing secrets'
        required: true

jobs:
  init_plan:
    name: Init and Plan Terraform Project
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: arc-runners
    env:
      VAULT_ADDR: ${{ vars.VAULT_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.head_ref }}

      - name: Get Google Cloud auth_token
        id: get-auth-token
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_WORKLOAD_SERVICE_ACCOUNT }}
          # project_id: ${{ vars.GCP_PROJECT_ID }}

      # - name: Setup Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ">= 1.14.6"

      - name: Run terraform init
        env:
          ALL_CHANGED_DIRS: ${{ inputs.all_changed_dirs }}
        run: |
          for dir in $ALL_CHANGED_DIRS; do
            if ! find "$dir" -maxdepth 1 -type f -name '*.tf' | grep -q .; then
              echo "::notice::Skipping $dir (no .tf files found)"
              continue
            fi
            echo "Running terraform init for $dir"
            cd "$dir"
            terraform init
            cd -
          done

      - name: Run terraform validate
        env:
          ALL_CHANGED_DIRS: ${{ inputs.all_changed_dirs }}
        run: |
          for dir in $ALL_CHANGED_DIRS; do
            if ! find "$dir" -maxdepth 1 -type f -name '*.tf' | grep -q .; then
              echo "::notice::Skipping $dir (no .tf files found)"
              continue
            fi
            echo "Running terraform validate for $dir"
            cd "$dir"
            terraform validate
            cd -
          done

      - name: Run terraform plan
        env:
          ALL_CHANGED_DIRS: ${{ inputs.all_changed_dirs }}
        run: |
          mkdir -p /tmp/tfplans
          for dir in $ALL_CHANGED_DIRS; do
            if ! find "$dir" -maxdepth 1 -type f -name '*.tf' | grep -q .; then
              echo "::notice::Skipping $dir (no .tf files found)"
              continue
            fi
            echo "Running terraform plan for $dir"
            cd "$dir"
            safe_name="$(echo "$dir" | tr '/ ' '__')"
            terraform plan -out="/tmp/tfplans/${safe_name}.tfplan"
            terraform show -no-color "/tmp/tfplans/${safe_name}.tfplan" > "/tmp/tfplans/${safe_name}.txt"
            cd -
          done

      - name: Upload terraform plans
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plans-${{ github.run_id }}
          path: /tmp/tfplans/*
          if-no-files-found: warn
          retention-days: 7
