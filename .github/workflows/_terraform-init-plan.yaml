---
name: Init and Plan Terraform
on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository containing Terraform code to lint'
        type: string
        default: ''
      ref:
        description: 'Branch or ref to check out. Defaults to the PR head branch.'
        type: string
        default: ''
      all_changed_dirs:
        description: 'List of all changed dirs'
        type: string
        default: ''
      auth_token:
        description: 'Google Cloud auth token'
        type: string
        default: ''
      project_id:
        description: 'Google Cloud project ID'
        type: string
        default: ''
    secrets:
      VAULT_TOKEN:
        description: 'Vault token for accessing secrets'
        required: true
    outputs:
      tf_dirs:
        description: 'List of all changed dirs containing Terraform files'
        value: ${{ jobs.set_files_dirs.outputs.tf_dirs }}
      run_id:
        description: 'Run ID'
        value: ${{ github.run_id }}

jobs:
  set_files_dirs:
    name: Set Changed Files and Directories
    permissions:
      contents: 'read'
    runs-on: arc-runners
    outputs:
      tf_dirs: ${{ steps.get-changed-dirs.outputs.tf_dirs }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.head_ref }}

      - name: Get dirs of changed Terraform files
        id: get-changed-dirs
        env:
          ALL_CHANGED_DIRS: ${{ inputs.all_changed_dirs }}
        run: |
          for dir in $ALL_CHANGED_DIRS; do
            if find "$dir" -maxdepth 1 -type f -name "*.tfvars" | grep -q tfvars; then
              tf_dirs+=("${dir}")
            fi
          done
          echo "Terraform Dirs - ${tf_dirs[*]}"
          json_array=$(jq --compact-output --null-input '$ARGS.positional' --args "${tf_dirs[@]}")
          echo "tf_dirs=${json_array}" >> "$GITHUB_OUTPUT"

  init_plan:
    name: Init and Plan Terraform Project
    needs: set_files_dirs
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: arc-runners
    strategy:
      matrix:
        tf_dir: ${{ fromJSON(needs.set_files_dirs.outputs.tf_dirs) }}
      fail-fast: true
      max-parallel: 2
    concurrency:
      group: "init-plan-${{ matrix.tf_dir }}"
      cancel-in-progress: true
    env:
      VAULT_ADDR: ${{ vars.VAULT_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.head_ref }}

      - name: Get Google Cloud auth_token
        id: get-auth-token
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_WORKLOAD_SERVICE_ACCOUNT }}
          # project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ">= 1.15.0"

      - name: Run terraform init
        working-directory: ${{ matrix.tf_dir }}
        env:
          DIR: ${{ matrix.tf_dir }}
        run: |
          echo "Running terraform init for ${DIR}"
          terraform init -backend-config="prefix=${DIR}" -input=false

      - name: Run terraform validate
        working-directory: ${{ matrix.tf_dir }}
        env:
          DIR: ${{ matrix.tf_dir }}
        run: |
            echo "Running terraform validate for $DIR"
            terraform validate

      - name: Run terraform plan
        working-directory: ${{ matrix.tf_dir }}
        env:
          DIR: ${{ matrix.tf_dir }}
        run: |
          echo "Creating file name from matrix tf_dir: $DIR"
          safe_name="${DIR//\//_}"
          echo "Running terraform plan for $DIR"
          terraform plan -no-color -input=false -out=tfplan-${safe_name}

      - name: Post Plan to GitHub Actions Summary
        id: post-plan-summary
        working-directory: ${{ matrix.tf_dir }}
        env:
          DIR: ${{ matrix.tf_dir }}
        run: |
          echo "Creating file name from matrix tf_dir: $DIR"
          safe_name="${DIR//\//_}"
          echo "safe_name=$safe_name" >> "$GITHUB_OUTPUT"
          echo "### 🚀 Terraform Plan Output" >> "$GITHUB_STEP_SUMMARY"
          echo "<details><summary>Click to expand plan details</summary>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`terraform" >> "$GITHUB_STEP_SUMMARY"
          terraform show -no-color tfplan-${safe_name} >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "</details>" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Plan Artifact
        id: upload-plan-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tfplan-${{ steps.post-plan-summary.outputs.safe_name }}
          path: ${{ matrix.tf_dir }}/tfplan*
          retention-days: 7

      - name: Display Artifact Info
        run: |
          echo "Run ID: ${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact Name: tfplan-${{ steps.post-plan-summary.outputs.safe_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Plan file(s) uploaded for directory: ${{ matrix.tf_dir }}" >> "$GITHUB_STEP_SUMMARY"