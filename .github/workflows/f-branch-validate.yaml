---
name: Workflows/Actions Validation

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  changes:
    name: Check for workflow or action file changes
    runs-on: arc-runners
    outputs:
      workflows: ${{ steps.changed.outputs.any_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: Check for workflow file changes
        id: changed
        shell: bash
        run: |
          set -euo pipefail

          base_sha="${{ github.event.before }}"
          head_sha="${{ github.sha }}"

          # New branches can have an all-zero before SHA. Fall back to the first parent.
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            if git rev-parse "${head_sha}^" >/dev/null 2>&1; then
              base_sha="${head_sha}^"
            else
              base_sha="$head_sha"
            fi
          fi

          changed_files="$(git diff --name-only "$base_sha" "$head_sha" -- \
            ':(glob).github/workflows/**/*.yaml' \
            ':(glob).github/workflows/**/*.yml' \
            ':(glob).github/actions/**/*.yaml' \
            ':(glob).github/actions/**/*.yml' \
          )"

          if [[ -n "$changed_files" ]]; then
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
          fi

  gha-checks:
    name: GitHub Actions Feature Branch Workflow Checks
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    uses: ./.github/workflows/_gha-f-workflow-checks.yaml

