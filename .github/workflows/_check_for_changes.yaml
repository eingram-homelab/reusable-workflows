---
name: Check for changed files

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository to check for changed files'
        type: string
        default: ''
      ref:
        description: 'Branch or ref to check out. Defaults to the current ref.'
        type: string
        default: ''
    outputs:
      any_changed:
        description: 'Indicates if any files have changed'
        value: ${{ jobs.check-for-changes.outputs.any_changed }}
      changed_files:
        description: 'List of changed files'
        value: ${{ jobs.check-for-changes.outputs.changed_files }}

jobs:
  check-for-changes:
    name: Check for changed files
    runs-on: arc-runners
    outputs:
      any_changed: ${{ steps.check-changes.outputs.any_changed }}
      changed_files: ${{ steps.check-changes.outputs.all_changed_files }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: Check for changed files
        id: check-changes
        uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad
        with:
          files: |
            .github/workflows/**
            .github/actions/**