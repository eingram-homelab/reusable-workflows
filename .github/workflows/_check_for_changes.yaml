---
name: Check for changed files

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository to check for changed files'
        type: string
        default: ''
      ref:
        description: 'Branch or ref to check out. Defaults to the current ref.'
        type: string
        default: ''
    outputs:
      any_changed:
        description: 'Indicates if any files have changed'
        value: ${{ jobs.check-for-changes.outputs.any_changed }}
      all_changed_files:
        description: 'List of changed files'
        value: ${{ jobs.check-for-changes.outputs.all_changed_files }}
      dir_names:
        description: 'List of unique directory names containing changed files'
        value: ${{ jobs.check-for-changes.outputs.dir_names }}

jobs:
  check-for-changes:
    name: Check for changed files
    runs-on: arc-runners
    outputs:
      any_changed: ${{ steps.check-changes.outputs.any_changed }}
      all_changed_files: ${{ steps.check-changes.outputs.all_changed_files }}
      dir_names: ${{ steps.check-changes.outputs.dir_names }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      # - name: Determine branch merge-base
      #   id: merge-base
      #   env:
      #     DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
      #   run: |
      #     git fetch --no-tags origin "$DEFAULT_BRANCH"
      #     base_sha="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"

      #     if [[ -z "$base_sha" ]]; then
      #       echo "Unable to determine merge-base with origin/$DEFAULT_BRANCH" >&2
      #       exit 1
      #     fi

      #     echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Check for changed files
        id: check-changes
        uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad
        # with:
        #   base_sha: ${{ steps.merge-base.outputs.base_sha }}
        #   sha: ${{ github.sha }}
        #   since_last_remote_commit: false

      - name: List all changed files
        env:
          ALL_CHANGED_FILES: ${{ steps.check-changes.outputs.all_changed_files }}
        run: |
          for file in ${ALL_CHANGED_FILES}; do
            echo "$file was changed"
          done
      
      - name: List unique directory names containing changed files
        id: list-dir-names
        env:
          DIR_NAMES: ${{ steps.check-changes.outputs.dir_names }}
        run: |
          dir_names=$(for dir in $DIR_NAMES; do dirname "$dir"; done | sort -u)
          echo "dir_names=$dir_names"
