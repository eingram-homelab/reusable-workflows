---
name: Check for changed files

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository to check for changed files'
        type: string
        default: ''
      ref:
        description: 'Branch or ref to check out. Defaults to the current ref.'
        type: string
        default: ''
    outputs:
      any_changed:
        description: 'Indicates if any files have changed'
        value: ${{ jobs.check-for-changes.outputs.any_changed }}
      all_changed_files:
        description: 'List of changed files'
        value: ${{ jobs.check-for-changes.outputs.all_changed_files }}
      all_changed_dirs:
        description: 'List of unique directory names containing changed files'
        value: ${{ jobs.check-for-changes.outputs.all_changed_dirs }}

jobs:
  check-for-changes:
    name: Check for changed files and dirs
    runs-on: arc-runners
    container:
      image: ghcr.io/eingram-homelab/homelab-runner:latest
    outputs:
      any_changed: ${{ steps.check-file-changes.outputs.any_changed }}
      all_changed_files: ${{ steps.check-file-changes.outputs.all_changed_files }}
      all_changed_dirs: ${{ steps.check-dir-changes.outputs.all_changed_files }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Check for changed files
        id: check-file-changes
        uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad
        with:
          dir_names: false

      - name: List all changed files
        env:
          ALL_CHANGED_FILES: ${{ steps.check-file-changes.outputs.all_changed_files }}
        run: |
          for file in ${ALL_CHANGED_FILES}; do
            echo "$file was changed"
          done

      - name: Check for changed dirs
        id: check-dir-changes
        uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad
        with:
          dir_names: true

      - name: List all changed directories
        env:
          DIR_NAMES: ${{ steps.check-dir-changes.outputs.all_changed_files }}
        run: |
          for dir in ${DIR_NAMES}; do
            echo "$dir was changed"
          done
