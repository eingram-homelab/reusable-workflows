---
name: Packer Build

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository containing Packer templates'
        type: string
        default: ''
      ref:
        description: 'Branch or ref to check out'
        type: string
        default: ''
      all_changed_dirs:
        description: 'Space-separated list of unique directory names containing changed files. Overrides changed-files detection when provided (e.g. for manual dispatch).'
        type: string
        default: ''
    secrets:
      VAULT_TOKEN:
        description: 'Vault token with permissions to access secrets needed for build'
        required: true
    outputs:
      TMPL_NAME:
        description: 'Timestamped vSphere template name produced by packer build'
        value: ${{ jobs.build.outputs.TMPL_NAME }}
      SKIP_BUILD:
        description: 'Indicates whether the build was skipped due to skip_build flag in hcl file'
        value: ${{ jobs.build.outputs.SKIP_BUILD }}

jobs:
  build:
    outputs:
      TMPL_NAME: ${{ steps.set_TMPL_NAME.outputs.TMPL_NAME }}
      SKIP_BUILD: ${{ steps.skip_check.outputs.skip_build }}
    name: Packer Build
    runs-on: arc-runners
    env:
      VAULT_ADDR: ${{ vars.VAULT_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.head_ref }}

      - name: Check for skip_build flag in hcl file
        id: skip_check
        run: |
          if grep -RIl --include='*.hcl' 'skip_build = true' .; then
            echo "Found skip_build = true in hcl file. Skipping build."
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
            echo "SKIP_BUILD=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "skip_build=false" >> "$GITHUB_OUTPUT"
          echo "SKIP_BUILD=false" >> "$GITHUB_ENV"

      - name: Setup Packer
        if: env.SKIP_BUILD != 'true'
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789
        with:
          version: '1.15.4'

      - name: Run packer init
        if: env.SKIP_BUILD != 'true'
        env:
          ALL_CHANGED_DIRS: ${{ inputs.all_changed_dirs }}
        run: |
          for dir in $ALL_CHANGED_DIRS; do
            if ! find "$dir" -maxdepth 1 -type f -name '*.hcl' | grep -q .; then
              echo "::notice::Skipping $dir (no .hcl files found)"
              continue
            fi
            echo "::notice::Running packer init for $dir"
            packer init "$dir"
          done

      - name: Run packer build
        if: env.SKIP_BUILD != 'true'
        env:
          ALL_CHANGED_DIRS: ${{ inputs.all_changed_dirs }}
        run: |
          # xorriso needed for vsphere-iso to build Windows template
          sudo apt-add-repository universe
          sudo apt-get install -y xorriso
          for dir in $ALL_CHANGED_DIRS; do
            if ! find "$dir" -maxdepth 1 -type f -name '*.hcl' | grep -q .; then
              echo "::notice::Skipping $dir (no .hcl files found)"
              continue
            fi
            echo "::group::Building $dir"
            if ! packer build "$dir"; then
              echo "::error::Packer build failed for $dir"
              echo "::endgroup::"
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Set vars from artifact info
        if: env.SKIP_BUILD != 'true'
        env:
          ALL_CHANGED_DIRS: ${{ inputs.all_changed_dirs }}
        id: set_TMPL_NAME
        run: |
          for dir in $ALL_CHANGED_DIRS; do
            echo "::notice::Setting vars for $dir"
            echo "TMPL_NAME=$(jq -r '.builds[0].artifact_id' "$dir/build-manifest.json")" >> "$GITHUB_OUTPUT"
          done
