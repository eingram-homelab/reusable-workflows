---
name: Terraform Validate Workflow
on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository containing Terraform code to lint'
        type: string
        default: ''
      ref:
        description: 'Branch or ref to check out. Defaults to the PR head branch.'
        type: string
        default: ''
      all_changed_dirs:
        description: 'List of unique directory names containing changed files'
        type: string
        default: ''

jobs:
  tflint:
    runs-on: arc-runners
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        name: Checkout source code
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.head_ref }}
          fetch-depth: 0

      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a
        name: Setup TFLint
        with:
          tflint_version: v0.64.0
          cache: true

      - name: Show version
        run: tflint --version

      - name: Init TFLint
        run: tflint --init
        env:
          # https://github.com/terraform-linters/tflint/blob/master/docs/user-guide/plugins.md#avoiding-rate-limiting
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        env:
          ALL_CHANGED_DIRS: ${{ inputs.all_changed_dirs }}
        run: |
          for dir in $ALL_CHANGED_DIRS; do
            if ! find "$dir" -maxdepth 1 -type f -name '*.tf' | grep -q .; then
              echo "::notice::Skipping $dir (no .tf files found)"
              continue
            fi
            tflint --chdir="$dir"
          done
