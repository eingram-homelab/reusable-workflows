---
name: Check PR Status

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository to check for PR status'
        type: string
        default: ''
      ref:
        description: 'Branch or ref to check out. Defaults to the current ref.'
        type: string
        default: ''
      run-id:
        description: 'Run ID'
        type: string
        required: true
  
permissions:
  contents: 'read'
  pull-requests: 'read'

jobs:
  get-pr-status:
    name: Get PR Status
    runs-on: arc-runners
    outputs:
      pr-status: ${{ steps.pr-status.outputs.pr-status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}

      - name: Check for PR Approval
        id: pr-status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ inputs.repository || github.repository }}
          RUN_ID: ${{ inputs.run-id }}
        run: |
          head_sha=$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}" --jq '.head_sha')
          pr=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${REPOSITORY}/commits/${head_sha}/pulls" \
            --jq '.[0].number')

          if [[ -z "$pr" || "$pr" == "null" ]]; then
            echo "No pull request found for workflow run ${RUN_ID} (commit ${head_sha})."
            exit 1
          fi

          pr_status=$(gh api "repos/${REPOSITORY}/pulls/${pr}" --jq '.merged')
          echo "PR #${pr} merged: ${pr_status}"
          echo "pr-status=${pr_status}" >> "$GITHUB_OUTPUT"
          if [[ "$pr_status" != "true" ]]; then
            echo "PR is not merged. Exiting."
            exit 1
          fi
