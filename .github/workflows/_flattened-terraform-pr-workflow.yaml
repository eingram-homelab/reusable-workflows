---
name: Flattened Terraform Workflow Checks - Pull Request

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository containing Terraform projects'
        type: string
        default: ''
      ref:
        description: 'Branch or ref to check out. Defaults to the PR head branch.'
        type: string
        default: ''
      pull_request_number:
        description: 'Pull request number'
        type: number
        default: 0
    secrets:
      VAULT_TOKEN:
        description: 'Vault token for accessing secrets'
        required: true

jobs:
  check_for_changes:
    name: Check for changed files
    uses: ./.github/workflows/_check_for_changes.yaml
    with:
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}

  init_plan:
    name: Init and Plan Terraform Projects
    needs: check_for_changes
    if: |
      needs.check_for_changes.outputs.any_changed == 'true' &&
      contains(needs.check_for_changes.outputs.all_changed_files, '.tfvars')
    permissions:
      contents: 'read'
      id-token: 'write'
      pull-requests: 'write'
    uses: ./.github/workflows/_terraform-init-plan.yaml
    with:
      all_changed_dirs: ${{ needs.check_for_changes.outputs.all_changed_dirs }}
      pull_request_number: ${{ inputs.pull_request_number }}
    secrets:
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}

  alert_no_changes:
    name: Alert No Changes
    needs: check_for_changes
    if: |
      needs.check_for_changes.outputs.any_changed == 'false' ||
      !contains(needs.check_for_changes.outputs.all_changed_files, '.tfvars')
    runs-on: arc-runners
    steps:
      - run: |
          echo "::warning title=No tfvars found::No .tfvars file found in the changed directories, skipping"
          echo "- ⚠️ No \`.tfvars\` file found in the changed directories, skipping" >> "$GITHUB_STEP_SUMMARY"
