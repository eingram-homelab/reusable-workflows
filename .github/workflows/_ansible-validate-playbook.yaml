---
name: Validate Ansible Files

on:
  workflow_call:
    inputs:
      changed_files:
        description: 'List of changed files'
        type: string
      requirements_file:
        description: 'Path to the requirements.txt file relative to the repository root'
        type: string
        default: ''
      working_directory:
        description: 'Working directory for ansible-lint'
        type: string
        default: ''

jobs:
  validate:
    name: Validate Ansible Playbooks and Roles
    runs-on: arc-runners
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: Ansible Lint
        uses: ansible/ansible-lint@v26.6.0
        with:
          args: ""
          setup_python: "true"
          python_version: "3.14"
          working_directory: ${{ inputs.working_directory }}
          requirements_file: ${{ inputs.requirements_file }}
