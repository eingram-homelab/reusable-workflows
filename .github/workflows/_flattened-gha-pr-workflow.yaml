---
name: Flattened GitHub Actions Workflow Checks - Pull Request

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository to check for changed files'
        type: string
        default: ''
      yamllint_config:
        description: 'Path to yamllint config file relative to the repository root'
        type: string
        default: ''
      ref:
        description: 'Branch or ref to check out. Defaults to the current ref.'
        type: string
        default: ''
      project_base_dir:
        description: 'Project base directory passed to the Sonar scanner'
        type: string
        default: '.'
      sonar_properties_path:
        description: 'Path to the sonar-project.properties file relative to the repository root'
        type: string
        default: 'sonar-project.properties'
      fetch_depth:
        description: 'Git fetch depth to use during checkout. Use 0 for full history.'
        type: number
        default: 0
      scan_args:
        description: 'Additional arguments passed to the Sonar scanner'
        type: string
        default: ''
      run_sonarqube_scan:
        description: 'Whether to run the SonarQube scan after validation checks'
        type: boolean
        default: true
    secrets:
      sonar_token:
        description: 'SonarQube token for code analysis'
        required: true

jobs:
  check_for_changes:
    name: Check for changed files
    uses: ./.github/workflows/_check_for_changes.yaml
    with:
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}

  validate:
    name: Run Validation Checks
    needs: check_for_changes
    if: needs.check_for_changes.outputs.any_changed == 'true'
    uses: ./.github/workflows/_gha-validate-workflow.yaml
    with:
      all_changed_files: ${{ needs.check_for_changes.outputs.all_changed_files }}
      yamllint_config: ${{ inputs.yamllint_config }}

  sonarqube:
    name: Run SonarQube Scan
    if: inputs.run_sonarqube_scan == true
    uses: ./.github/workflows/_sonarqube-scan.yaml
    with:
      ref: ${{ inputs.ref || github.ref }}
      project_base_dir: ${{ inputs.project_base_dir }}
      sonar_properties_path: ${{ inputs.sonar_properties_path }}
      scan_args: ${{ inputs.scan_args }}
    secrets:
      sonar_token: ${{ secrets.sonar_token }}
