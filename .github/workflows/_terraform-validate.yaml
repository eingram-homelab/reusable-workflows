---
name: Validate Terraform

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository containing Terraform code to validate'
        type: string
        default: ''
      ref:
        description: 'Branch or ref to check out. Defaults to the PR head branch.'
        type: string
        default: ''
      all_changed_dirs:
        description: 'Space-separated list of unique directory names containing changed files'
        type: string
        default: ''
      gcp_workload_identity_provider:
        description: 'Full resource name of the Google Cloud Workload Identity Provider'
        type: string
        required: true
      gcp_project_id:
        description: 'Google Cloud project ID'
        type: string
        required: true

jobs:
  validate:
    name: Check Terraform Project Format
    runs-on: arc-runners
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.head_ref }}

      # - name: Setup Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.11.3

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ inputs.gcp_project_id }}
          workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}

      - name: Check Format of Terraform files
        env:
          ALL_CHANGED_DIRS: ${{ inputs.all_changed_dirs }}
        run: |
          for dir in $ALL_CHANGED_DIRS; do
            echo "::notice::=== Processing $dir ==="
            echo "::notice::Running terraform fmt -check for $dir"
            terraform fmt -check "$dir"
            echo "::notice::Finished checking format for $dir"
          done

